# Source: github.com/cloudnativetrainings/advanced-operations-of-kubernetes-with-kubeone
#         09_helm-releases/README.md (commit b528898), helmReleases block.
# Changed for the Hetzner Cloud course (Chapter 10): the ingress-nginx
# LoadBalancer Service gets the annotation load-balancer.hetzner.cloud/location,
# because the hcloud cloud controller manager refuses to create a load balancer
# without a location or network zone.
#
# Append this block to kubeone.yaml, then run kubeone apply:
#   cat 10_helm-releases/helm-releases.yaml >> kubeone.yaml
helmReleases:
  - releaseName: ingress-nginx
    chart: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    namespace: ingress-nginx
    version: 4.12.2
    values:
      - inline:
          controller:
            replicaCount: 2
            autoscaling:
              enabled: true
              minReplicas: 2
              maxReplicas: 5
              targetCPUUtilizationPercentage: 80
              targetMemoryUtilizationPercentage: 80
            service:
              annotations:
                load-balancer.hetzner.cloud/location: nbg1
  - releaseName: cert-manager
    chart: cert-manager
    repoURL: https://charts.jetstack.io
    namespace: cert-manager
    version: v1.17.2
    values:
      - inline:
          crds:
            enabled: true
