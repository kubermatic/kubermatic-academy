# Based on github.com/cloudnativetrainings/advanced-operations-of-kubernetes-with-kubeone
# 09_helm-releases/cluster-issuer.yaml (commit b528898).
# Changed for the Hetzner Cloud course (Chapter 10):
# - The HTTP-01 solver uses the Gateway API (gatewayHTTPRoute) and attaches its
#   temporary HTTPRoute to the http listener of gateway/training-gateway.
#   https://cert-manager.io/docs/configuration/acme/http01/
# - The email field is removed. spec.acme.email is optional in cert-manager
#   v1.21.3, an ACME account does not need a contact address, and Let's
#   Encrypt rejects placeholder addresses such as your-email@example.com. Add
#   `email: "<your address>"` under spec.acme if you want one on the account.
#
#   kubectl apply -f 10_helm-releases/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: training-gateway
                namespace: gateway
                kind: Gateway
                sectionName: http
