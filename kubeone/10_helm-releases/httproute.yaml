# KubeOne Practitioner course, Chapter 10 (Helm Releases & Real Apps).
#
# Sends every request for the training domain to the training-application
# chart's Service my-app on port 80. The chart's own ingress option stays off.
#
# ${DOMAIN} is <gateway-ip>.sslip.io from Step 5 of the lab:
#   envsubst '$DOMAIN' < 10_helm-releases/httproute.yaml | kubectl apply -f -
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: training-application
  namespace: training-application
spec:
  parentRefs:
    - name: training-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - ${DOMAIN}
  rules:
    - backendRefs:
        - name: my-app
          port: 80
